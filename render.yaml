services:
  - type: web
    name: typeoye-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: typeoye-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /ads.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml; charset=utf-8
    routes:
      - type: rewrite
        source: /ads.txt
        destination: /ads.txt
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
