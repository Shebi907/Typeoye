<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Improving Urdu typing speed and accuracy online</title>
  <desc id="desc">A screen shows an Urdu typing practice session with a large Urdu phrase, a speed dial, and an accuracy meter, beside a ruler and a stopwatch representing speed and accuracy goals.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf1ff"/></linearGradient>
    <linearGradient id="screenFrame" x2="1" y2="1"><stop stop-color="#334155"/><stop offset=".5" stop-color="#17283b"/><stop offset="1" stop-color="#0f1d2e"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f9fcff"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#4361ee"/><stop offset="1" stop-color="#14a89a"/></linearGradient>
    <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#f4f8fb"/><stop offset="1" stop-color="#e8eef3"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.6"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="7" cy="11" r="1" fill="#7c9cab" opacity=".12"/><circle cx="51" cy="58" r="1" fill="#7c9cab" opacity=".10"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <circle cx="1330" cy="170" r="215" fill="#bdebe4" opacity=".27"/>
  <circle cx="240" cy="700" r="245" fill="#cbd8ff" opacity=".30"/>
  <path d="M0 662Q320 622 650 662t950-5v243H0Z" fill="url(#desk)"/>
  <path d="M0 662Q320 622 650 662t950-5" fill="none" stroke="#d9e5ec" stroke-width="3"/>
  <ellipse cx="800" cy="758" rx="600" ry="86" fill="#536b7a" opacity=".20" filter="url(#shadow)"/>

  <!-- Monitor -->
  <rect x="330" y="128" width="940" height="540" rx="30" fill="#314556" opacity=".14" filter="url(#soft)"/>
  <rect x="342" y="104" width="916" height="548" rx="28" fill="url(#screenFrame)" stroke="#526678" stroke-width="3"/>
  <rect x="366" y="128" width="868" height="500" rx="14" fill="url(#screen)"/>
  <rect x="366" y="128" width="868" height="46" rx="14" fill="#f5f8fb"/>
  <path d="M366 160v-18a14 14 0 0 1 14-14h840a14 14 0 0 1 14 14v18" fill="#f5f8fb"/>
  <circle cx="396" cy="151" r="6" fill="#9eb1bd"/><circle cx="416" cy="151" r="6" fill="#9eb1bd"/><circle cx="436" cy="151" r="6" fill="#9eb1bd"/>
  <rect x="366" y="174" width="868" height="4" fill="url(#accent)" opacity=".85"/>

  <!-- Practice header -->
  <text x="410" y="232" fill="#172b3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Urdu Typing Practice</text>
  <text x="410" y="262" fill="#637789" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing=".4">ACCURACY FIRST, THEN SPEED</text>

  <!-- Urdu practice passage -->
  <rect x="404" y="286" width="792" height="132" rx="14" fill="#f2fbfa" stroke="#ccece7" stroke-width="2"/>
  <text x="800" y="372" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#163d4a" font-family="Noto Naskh Arabic, Noto Sans Arabic, Segoe UI, Tahoma, serif" font-size="46" font-weight="600">مشق سے رفتار بہتر ہوتی ہے</text>

  <!-- Progress bar -->
  <rect x="404" y="440" width="792" height="12" rx="6" fill="#e6edf3"/>
  <rect x="404" y="440" width="520" height="12" rx="6" fill="url(#accent)"/>

  <!-- Speed dial -->
  <g transform="translate(520 556)">
    <circle r="66" fill="#ffffff" stroke="#dbe6ee" stroke-width="3"/>
    <path d="M-46 8a46 46 0 0 1 92 0" fill="none" stroke="#4361ee" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <path d="M-46 8a46 46 0 0 1 92 0" fill="none" stroke="#e6edf3" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 999"/>
    <line x1="0" y1="8" x2="30" y2="-26" stroke="#14a89a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="7" fill="#172b3d"/>
    <text x="0" y="34" text-anchor="middle" fill="#172b3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">42</text>
    <text x="0" y="54" text-anchor="middle" fill="#637789" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">WPM</text>
  </g>

  <!-- Accuracy meter -->
  <g transform="translate(800 556)">
    <circle r="66" fill="#ffffff" stroke="#dbe6ee" stroke-width="3"/>
    <circle r="46" fill="none" stroke="#e6edf3" stroke-width="10"/>
    <path d="M0 -46a46 46 0 0 1 44 32" fill="none" stroke="#14a89a" stroke-width="10" stroke-linecap="round"/>
    <text x="0" y="10" text-anchor="middle" fill="#172b3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">98%</text>
    <text x="0" y="34" text-anchor="middle" fill="#637789" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">ACCURACY</text>
  </g>

  <!-- Daily routine chip -->
  <g transform="translate(1080 556)">
    <rect x="-92" y="-66" width="184" height="132" rx="18" fill="#ffffff" stroke="#dbe6ee" stroke-width="3"/>
    <text x="0" y="-22" text-anchor="middle" fill="#172b3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">15 min</text>
    <text x="0" y="4" text-anchor="middle" fill="#637789" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">DAILY ROUTINE</text>
    <rect x="-56" y="22" width="112" height="10" rx="5" fill="#e6edf3"/>
    <rect x="-56" y="22" width="84" height="10" rx="5" fill="url(#accent)"/>
  </g>

  <!-- Monitor stand -->
  <path d="M760 652h80l-8 40h-64Z" fill="#95a8b5" opacity=".6"/>
  <rect x="700" y="692" width="200" height="14" rx="7" fill="#aebec9" opacity=".7"/>

  <!-- Ruler + stopwatch accents -->
  <g transform="translate(300 520) rotate(-90)">
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#ffffff" stroke="#dbe6ee" stroke-width="2"/>
    <g stroke="#9fb3c0" stroke-width="2">
      <line x1="20" y1="0" x2="20" y2="12"/>
      <line x1="60" y1="0" x2="60" y2="12"/>
      <line x1="100" y1="0" x2="100" y2="12"/>
      <line x1="140" y1="0" x2="140" y2="12"/>
      <line x1="180" y1="0" x2="180" y2="12"/>
    </g>
  </g>
  <g transform="translate(1348 470)">
    <circle r="44" fill="#ffffff" stroke="#dbe6ee" stroke-width="3"/>
    <circle r="30" fill="none" stroke="#e6edf3" stroke-width="6"/>
    <path d="M0 -30a30 30 0 0 1 20 51" fill="none" stroke="#4361ee" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#172b3d" stroke-width="4" stroke-linecap="round"/>
    <rect x="-6" y="-54" width="12" height="10" rx="3" fill="#aebec9"/>
  </g>
</svg>
