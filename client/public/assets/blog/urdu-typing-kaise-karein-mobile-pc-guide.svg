<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Urdu typing on mobile and PC</title>
  <desc id="desc">A smartphone and laptop show Urdu script while a learner types with an Urdu keyboard on each device.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6ff"/><stop offset="1" stop-color="#d8e6f2"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9c89e"/><stop offset="1" stop-color="#c18b61"/></linearGradient>
    <linearGradient id="phoneFrame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#384c66"/><stop offset="1" stop-color="#1c2d43"/></linearGradient>
    <linearGradient id="laptopFrame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35475c"/><stop offset="1" stop-color="#1d2a3a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f3f8fd"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3185dc"/><stop offset="1" stop-color="#6950e7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="145%" height="155%"><feDropShadow dx="0" dy="18" stdDeviation="21" flood-color="#243c56" flood-opacity=".2"/></filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="108" r="240" fill="#fff" opacity=".38"/>
  <rect y="615" width="1600" height="285" fill="#d7e1e8"/>
  <ellipse cx="860" cy="740" rx="690" ry="100" fill="#263e55" opacity=".1" filter="url(#soft)"/>

  <!-- Soft window light and a small plant -->
  <rect x="72" y="74" width="310" height="420" rx="24" fill="#c6dbea"/>
  <rect x="91" y="93" width="272" height="382" rx="15" fill="#f3faff"/>
  <path d="M222 93v382M91 279h272" stroke="#c6dbea" stroke-width="12"/>
  <path d="M101 264c35-71 76-82 121-34v49H101zM234 254c34-61 75-68 119-25v50H234z" fill="#acd5c2"/>
  <path d="M0 658 1600 621v279H0z" fill="url(#desk)"/>
  <path d="M0 684 1600 647" stroke="#f5d8b3" stroke-width="9" opacity=".7"/>
  <g transform="translate(1430 490)">
    <path d="M58 120c-2-74-11-132-27-182M62 98c32-45 59-67 98-82M53 83C22 48 3 17-14-24M48 59c-6-50 1-85 23-117" fill="none" stroke="#4d8b69" stroke-width="8" stroke-linecap="round"/>
    <path d="M32 1C-5 0-28-26-24-59 9-61 36-39 32 1zM98 39c6-38 32-66 68-69 0 34-24 62-68 69zM72-35c-28-25-27-57-4-82 29 18 37 50 4 82z" fill="#67a980"/>
    <path d="M8 113h107l-13 84H21z" fill="#f7fafc"/><ellipse cx="61" cy="114" rx="54" ry="13" fill="#d4dfe6"/><ellipse cx="61" cy="117" rx="42" ry="8" fill="#76583f"/>
  </g>

  <!-- Smartphone with Urdu keyboard -->
  <g filter="url(#shadow)" transform="rotate(-5 315 425)">
    <rect x="108" y="147" width="401" height="568" rx="46" fill="url(#phoneFrame)"/>
    <rect x="123" y="163" width="371" height="536" rx="35" fill="#101c2c"/>
    <rect x="137" y="182" width="343" height="500" rx="27" fill="url(#screen)"/>
    <rect x="245" y="170" width="132" height="15" rx="8" fill="#111d2d"/>
    <text x="159" y="221" fill="#294760" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">MOBILE</text>
    <circle cx="449" cy="215" r="5" fill="#31a27f"/>
    <rect x="157" y="243" width="303" height="204" rx="17" fill="#fff" stroke="#e1eaf2" stroke-width="2"/>
    <rect x="175" y="260" width="108" height="23" rx="12" fill="#e9f4ff"/>
    <text x="229" y="276" text-anchor="middle" fill="#4777a2" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">URDU MESSAGE</text>
    <text x="432" y="328" text-anchor="end" direction="rtl" fill="#173b62" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="27">السلام علیکم</text>
    <text x="432" y="373" text-anchor="end" direction="rtl" fill="#345b80" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="22">آپ کیسے ہیں؟</text>
