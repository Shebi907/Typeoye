      <rect x="17" y="78" width="67" height="28" rx="6" fill="#8ac4e8"/><rect x="90" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="135" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="180" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="225" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="270" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="315" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="360" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="405" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="450" y="78" width="39" height="28" rx="6" fill="#8ac4e8"/><rect x="495" y="78" width="120" height="28" rx="6"/>
      <rect x="17" y="114" width="77" height="17" rx="5"/><rect x="100" y="114" width="47" height="17" rx="5"/><rect x="153" y="114" width="47" height="17" rx="5"/><rect x="206" y="114" width="214" height="17" rx="5"/><rect x="426" y="114" width="47" height="17" rx="5"/><rect x="479" y="114" width="47" height="17" rx="5"/><rect x="532" y="114" width="83" height="17" rx="5"/>
    </g>
    <g fill="#38566f" font-family="Arial,sans-serif" font-size="11" font-weight="700"><text x="100" y="96">A</text><text x="145" y="96">S</text><text x="190" y="96">D</text><text x="235" y="96">F</text><text x="280" y="96">J</text><text x="325" y="96">K</text><text x="370" y="96">L</text><text x="415" y="96">;</text></g>
  </g>

  <!-- Hands entering Urdu text on both devices -->
  <path d="M0 784c50-37 111-47 172-29l90 27c25 8 35 27 25 44-8 14-24 18-47 10l-87-28-153 61z" fill="url(#blue)"/>
  <path d="M206 786c17-17 37-22 56-15 15 5 25 15 42 17l48 6c20 2 27 15 20 27-6 12-19 16-38 13l-69-9c-32-4-52-18-59-39z" fill="#c98d6d"/>
  <path d="M1302 767c62-41 129-48 199-25 39 13 74 34 99 61v97h-326l-41-62c-11-27 20-55 69-71z" fill="url(#blue)"/>
