    <rect x="168" y="478" width="281" height="30" rx="8" fill="#d8e3ee"/>
    <text x="307" y="498" text-anchor="middle" fill="#547089" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="17">اردو کی بورڈ</text>
    <g fill="#fff" stroke="#d1dce6" stroke-width="1">
      <rect x="168" y="516" width="34" height="29" rx="5"/><rect x="208" y="516" width="34" height="29" rx="5"/><rect x="248" y="516" width="34" height="29" rx="5"/><rect x="288" y="516" width="34" height="29" rx="5"/><rect x="328" y="516" width="34" height="29" rx="5"/><rect x="368" y="516" width="34" height="29" rx="5"/><rect x="408" y="516" width="41" height="29" rx="5"/>
      <rect x="178" y="552" width="34" height="29" rx="5"/><rect x="218" y="552" width="34" height="29" rx="5"/><rect x="258" y="552" width="34" height="29" rx="5"/><rect x="298" y="552" width="34" height="29" rx="5"/><rect x="338" y="552" width="34" height="29" rx="5"/><rect x="378" y="552" width="34" height="29" rx="5"/><rect x="418" y="552" width="31" height="29" rx="5"/>
      <rect x="188" y="588" width="41" height="29" rx="5"/><rect x="235" y="588" width="41" height="29" rx="5"/><rect x="282" y="588" width="76" height="29" rx="5"/><rect x="364" y="588" width="41" height="29" rx="5"/><rect x="411" y="588" width="38" height="29" rx="5"/>
    </g>
    <text x="307" y="639" text-anchor="middle" fill="#6382a0" font-family="Inter,Arial,sans-serif" font-size="12">space</text>
  </g>

  <!-- Laptop showing an Urdu document and phonetic example -->
  <g filter="url(#shadow)">
    <rect x="575" y="91" width="909" height="543" rx="28" fill="url(#laptopFrame)"/>
    <rect x="595" y="111" width="869" height="503" rx="17" fill="url(#screen)"/>
    <circle cx="1029" cy="100" r="4" fill="#8297ab"/>
    <rect x="595" y="111" width="869" height="54" rx="17" fill="#fff"/>
    <path d="M595 148h869v17H595z" fill="#fff"/>
    <circle cx="629" cy="138" r="8" fill="#477fd0"/>
    <text x="649" y="144" fill="#38546e" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Urdu typing practice</text>
    <rect x="1281" y="124" width="147" height="27" rx="14" fill="#e8f4ee"/>
    <circle cx="1299" cy="137" r="5" fill="#32a47d"/>
    <text x="1311" y="142" fill="#477761" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">PC · URDU INPUT</text>
    <rect x="630" y="191" width="798" height="354" rx="20" fill="#fff" stroke="#e1eaf2" stroke-width="2"/>
    <rect x="662" y="214" width="145" height="25" rx="12" fill="#edf5ff"/>
    <text x="734" y="231" text-anchor="middle" fill="#4d7aa3" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".5">RIGHT-TO-LEFT TEXT</text>
    <text x="1393" y="302" text-anchor="end" direction="rtl" fill="#173b61" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="32">اردو لکھنا آسان ہے</text>
    <text x="1393" y="354" text-anchor="end" direction="rtl" fill="#315a7d" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="25">اپنی پسند کا کی بورڈ منتخب کریں۔</text>
    <text x="1393" y="402" text-anchor="end" direction="rtl" fill="#315a7d" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="25">روزانہ تھوڑی مشق سے روانی بہتر ہوتی ہے۔</text>
    <path d="M661 435h733" stroke="#e8eef4" stroke-width="2"/>
    <text x="667" y="475" fill="#70859a" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">PHONETIC EXAMPLE</text>
    <rect x="662" y="489" width="326" height="38" rx="10" fill="#edf5ff"/>
    <text x="679" y="514" fill="#527394" font-family="Inter,Arial,sans-serif" font-size="16">slam</text>
    <path d="M755 508h48m-12-10 12 10-12 10" fill="none" stroke="#4285d1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="959" y="518" text-anchor="end" direction="rtl" fill="#17456e" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="23">سلام</text>
    <rect x="982" y="489" width="122" height="38" rx="10" fill="#eaf5ef"/>
    <text x="1043" y="514" text-anchor="middle" fill="#408065" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">KEY MAP</text>
    <rect x="958" y="634" width="139" height="24" rx="7" fill="#53687d"/>
    <path d="M831 658h394l52 25H778z" fill="#71869a"/>
  </g>

  <!-- Full keyboard in front of the laptop -->
  <g filter="url(#shadow)" transform="translate(740 704) skewX(-5)">
    <rect width="632" height="142" rx="18" fill="#27384d"/>
    <g fill="#e0e9f1">
      <rect x="17" y="15" width="35" height="23" rx="5"/><rect x="57" y="15" width="35" height="23" rx="5"/><rect x="97" y="15" width="35" height="23" rx="5"/><rect x="137" y="15" width="35" height="23" rx="5"/><rect x="177" y="15" width="35" height="23" rx="5"/><rect x="217" y="15" width="35" height="23" rx="5"/><rect x="257" y="15" width="35" height="23" rx="5"/><rect x="297" y="15" width="35" height="23" rx="5"/><rect x="337" y="15" width="35" height="23" rx="5"/><rect x="377" y="15" width="35" height="23" rx="5"/><rect x="417" y="15" width="35" height="23" rx="5"/><rect x="457" y="15" width="35" height="23" rx="5"/><rect x="497" y="15" width="118" height="23" rx="5"/>
