    <rect x="484" y="210" width="134" height="27" rx="7" fill="#f4f7fa" stroke="#dce4ec"/>
    <text x="498" y="228" fill="#566a7e" font-family="Inter,Arial,sans-serif" font-size="13">Urdu font  ▾</text>
    <path d="M637 214h17v18h-17zM666 214h17v18h-17zM695 214h17v18h-17z" fill="#eaf2fa" stroke="#cad7e3"/>
