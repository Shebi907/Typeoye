  <path d="M0 620 1600 583v317H0z" fill="url(#desk)"/>
  <path d="M0 647 1600 610" stroke="#f4d8b4" stroke-width="9" opacity=".7"/>
  <path d="M0 820 1600 779" stroke="#a96f4c" stroke-width="3" opacity=".24"/>

  <!-- Generic word processor screen with explicit right-to-left controls -->
  <g filter="url(#shadow)">
