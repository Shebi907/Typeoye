    <text x="824" y="228" fill="#315f8d" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Right-to-left</text>
    <rect x="950" y="206" width="102" height="34" rx="9" fill="#f6f8fb" stroke="#e1e7ee"/>
    <path d="M967 216h13M967 221h13M967 226h13" stroke="#7890a7" stroke-width="2" stroke-linecap="round"/>
    <text x="986" y="228" fill="#6d8093" font-family="Inter,Arial,sans-serif" font-size="12">Align ▾</text>

    <!-- Page -->
    <rect x="573" y="267" width="780" height="383" rx="5" fill="url(#paper)" stroke="#e0e7ef"/>
    <rect x="606" y="290" width="714" height="39" rx="8" fill="#f2f7fd"/>
    <circle cx="628" cy="309" r="6" fill="#34a985"/>
    <text x="647" y="315" fill="#668098" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing=".8">URDU DOCUMENT · RIGHT-TO-LEFT</text>
    <text x="1298" y="381" text-anchor="end" direction="rtl" fill="#183b64" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="35">میری پہلی اردو دستاویز</text>
    <text x="1298" y="435" text-anchor="end" direction="rtl" fill="#315778" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="27">اردو لکھنے کے لیے درست کی بورڈ منتخب کریں۔</text>
    <text x="1298" y="483" text-anchor="end" direction="rtl" fill="#315778" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="27">پیراگراف کی سمت دائیں سے بائیں رکھیں۔</text>
    <text x="1298" y="531" text-anchor="end" direction="rtl" fill="#315778" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="27">یونیکوڈ فونٹ سے متن واضح دکھائی دیتا ہے۔</text>
    <path d="M1276 552v31" stroke="#3287db" stroke-width="3" stroke-linecap="round"/>
    <rect x="606" y="596" width="714" height="1.5" fill="#e6edf4"/>
    <text x="621" y="626" fill="#8999a9" font-family="Inter,Arial,sans-serif" font-size="13">Page 1</text>
    <text x="1305" y="626" text-anchor="end" fill="#8999a9" font-family="Inter,Arial,sans-serif" font-size="13">Urdu Unicode text</text>
    <rect x="917" y="700" width="108" height="27" rx="8" fill="#475b70"/>
    <path d="M819 728h306l46 25H773z" fill="#718498"/>
  </g>

