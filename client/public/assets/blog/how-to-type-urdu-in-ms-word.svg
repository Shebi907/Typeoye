<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How to type Urdu in Microsoft Word</title>
  <desc id="desc">A close view of a word processor displaying a right-to-left Urdu document, with a keyboard and hands ready to type.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f3fb"/><stop offset="1" stop-color="#d3e2f0"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9c79d"/><stop offset="1" stop-color="#bd875e"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35475c"/><stop offset="1" stop-color="#1c2939"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3985c7"/><stop offset="1" stop-color="#275da2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="145%" height="155%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1b354f" flood-opacity=".2"/></filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="145%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#30475b" flood-opacity=".17"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1470" cy="120" r="245" fill="#fff" opacity=".34"/>
  <path d="M0 590h1600v310H0z" fill="#d8e2e9"/>

  <!-- Sunlit window and indoor greenery -->
  <rect x="64" y="68" width="350" height="414" rx="25" fill="#c5dbea"/>
  <rect x="82" y="86" width="314" height="378" rx="15" fill="#eef8ff"/>
  <path d="M239 86v378M82 272h314" stroke="#c6dce9" stroke-width="14"/>
  <path d="M99 247c42-79 95-91 140-32v47H99zM255 238c37-66 88-76 126-29v53H255zM95 445c35-70 93-78 144-25v44H95z" fill="#a6d2bd"/>
  <g transform="translate(70 426)">
    <path d="M69 95c-1-61-9-113-26-157M72 74c32-35 59-55 94-67M63 64C35 30 16 5-2-32M59 42c-5-47 2-79 22-109" fill="none" stroke="#4d8c69" stroke-width="8" stroke-linecap="round"/>
    <path d="M37-3C0-2-23-24-21-55c31-4 58 17 58 52zM103 20c7-34 30-56 64-60 1 31-22 55-64 60zM77-49c-26-24-25-53-2-77 27 17 34 46 2 77z" fill="#62a878"/>
    <path d="M15 90h110l-14 87H29z" fill="#f8fbfd"/><ellipse cx="70" cy="91" rx="56" ry="13" fill="#d1dde4"/><ellipse cx="70" cy="94" rx="43" ry="8" fill="#76573e"/>
  </g>

