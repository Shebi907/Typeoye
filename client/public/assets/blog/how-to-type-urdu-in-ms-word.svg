      <text x="29" y="29">Q</text><text x="73" y="29">W</text><text x="117" y="29">E</text><text x="161" y="29">R</text><text x="205" y="29">T</text><text x="249" y="29">Y</text><text x="293" y="29">U</text><text x="337" y="29">I</text><text x="381" y="29">O</text><text x="425" y="29">P</text><text x="469" y="29">A</text><text x="513" y="29">S</text>
    </g>
  </g>
