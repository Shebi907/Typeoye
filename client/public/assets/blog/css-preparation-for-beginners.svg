<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CSS Preparation for Beginners: Complete Guide to Starting Your CSS Journey in Pakistan">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#042f2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="emeraldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle geometric grid overlay -->
  <g opacity="0.06">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="white" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="white" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Decorative ambient glows -->
  <circle cx="150" cy="120" r="140" fill="#10b981" opacity="0.12" filter="blur(40px)"/>
  <circle cx="1080" cy="500" r="160" fill="#f59e0b" opacity="0.12" filter="blur(50px)"/>
  <circle cx="1050" cy="140" r="100" fill="#3b82f6" opacity="0.1" filter="blur(30px)"/>

  <!-- Left Side: Emblem / Books illustration -->
  <g transform="translate(100, 220)">
    <!-- Shield / Crest outline -->
    <path d="M70 10 L130 30 L130 90 C130 140 70 170 70 170 C70 170 10 140 10 90 L10 30 Z" fill="white" opacity="0.08" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Star & Crescent inside shield -->
    <circle cx="70" cy="80" r="28" fill="#10b981" opacity="0.3"/>
    <path d="M78 62 A24 24 0 1 0 78 98 A20 20 0 1 1 78 62 Z" fill="#f59e0b" opacity="0.8"/>
    <!-- Small 5-point star -->
    <polygon points="85,68 87,74 93,74 88,77 90,83 85,80 80,83 82,77 77,74 83,74" fill="#f59e0b"/>
  </g>

  <!-- Right Side: Feather pen & document stack -->
  <g transform="translate(980, 220)">
    <!-- Document Stack -->
    <rect x="0" y="40" width="100" height="130" rx="8" fill="white" opacity="0.06" stroke="white" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="15" y="25" width="100" height="130" rx="8" fill="white" opacity="0.08" stroke="white" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="30" y="10" width="100" height="130" rx="8" fill="white" opacity="0.12" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Document lines -->
    <line x1="45" y1="35" x2="115" y2="35" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="45" y1="50" x2="105" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="45" y1="65" x2="115" y2="65" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="45" y1="80" x2="95" y2="80" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="45" y1="95" x2="110" y2="95" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="45" y1="110" x2="80" y2="110" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Central Card -->
  <rect x="250" y="70" width="700" height="490" rx="24" fill="url(#cardGrad)" stroke="white" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Top Badge: Official Guide -->
  <rect x="490" y="110" width="220" height="34" rx="17" fill="url(#emeraldBadge)"/>
  <text x="600" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1.5">FPSC CSS GUIDE</text>

  <!-- Main Headline -->
  <text x="600" y="215" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">CSS Preparation</text>
  <text x="600" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="-0.5">for Beginners</text>

  <!-- Subtitle -->
  <text x="600" y="325" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" text-anchor="middle">Complete Guide to Starting Your CSS Journey in Pakistan</text>

  <!-- Decorative separator -->
  <g transform="translate(480, 355)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="0" r="4" fill="#f59e0b"/>
    <line x1="140" y1="0" x2="240" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 3 Feature Highlights (Pills) -->
  <g transform="translate(290, 395)">
    <!-- Pill 1: Eligibility & MPT -->
    <rect x="0" y="0" width="195" height="42" rx="21" fill="white" opacity="0.08" stroke="white" stroke-width="1" stroke-opacity="0.15"/>
    <text x="97" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">📋 Eligibility &amp; MPT</text>

    <!-- Pill 2: 1200 Marks Syllabus -->
    <rect x="212" y="0" width="195" height="42" rx="21" fill="white" opacity="0.08" stroke="white" stroke-width="1" stroke-opacity="0.15"/>
    <text x="309" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">📚 Compulsory &amp; Options</text>

    <!-- Pill 3: Study Timetable -->
    <rect x="424" y="0" width="195" height="42" rx="21" fill="white" opacity="0.08" stroke="white" stroke-width="1" stroke-opacity="0.15"/>
    <text x="521" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">⏱️ Study Timetable</text>
  </g>

  <!-- Bottom Brand strip inside card -->
  <rect x="250" y="505" width="700" height="55" rx="0" fill="black" opacity="0.25"/>
  <text x="600" y="538" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">TYPEOYE.COM • PRACTICAL EXAM &amp; SKILLS GUIDES</text>
</svg>
