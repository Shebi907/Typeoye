<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="How to Learn English Speaking at Home — a beginner's guide illustration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361EE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="white" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="white" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Left decorative circle -->
  <circle cx="80" cy="80" r="120" fill="white" opacity="0.05"/>
  <circle cx="80" cy="80" r="70" fill="white" opacity="0.06"/>

  <!-- Right decorative circle -->
  <circle cx="1130" cy="560" r="140" fill="white" opacity="0.05"/>
  <circle cx="1130" cy="560" r="80" fill="white" opacity="0.06"/>

  <!-- Speech bubble icon (left side) -->
  <g transform="translate(110, 230)">
    <rect x="0" y="0" width="140" height="90" rx="18" fill="white" opacity="0.15"/>
    <polygon points="30,90 15,115 65,90" fill="white" opacity="0.15"/>
    <!-- Dots inside bubble -->
    <circle cx="35" cy="45" r="8" fill="white" opacity="0.8"/>
    <circle cx="70" cy="45" r="8" fill="white" opacity="0.8"/>
    <circle cx="105" cy="45" r="8" fill="white" opacity="0.8"/>
  </g>

  <!-- Book / Learn icon (right side) -->
  <g transform="translate(970, 180)">
    <rect x="0" y="0" width="120" height="140" rx="10" fill="white" opacity="0.12"/>
    <rect x="10" y="20" width="100" height="8" rx="4" fill="white" opacity="0.6"/>
    <rect x="10" y="40" width="80" height="6" rx="3" fill="white" opacity="0.4"/>
    <rect x="10" y="58" width="90" height="6" rx="3" fill="white" opacity="0.4"/>
    <rect x="10" y="76" width="70" height="6" rx="3" fill="white" opacity="0.4"/>
    <rect x="10" y="94" width="85" height="6" rx="3" fill="white" opacity="0.4"/>
    <line x1="60" y1="0" x2="60" y2="140" stroke="white" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Headphones icon (top right) -->
  <g transform="translate(970, 390)">
    <path d="M60 15 C10 15 0 55 0 70 L0 95 C0 105 8 115 20 115 L30 115 C38 115 45 108 45 100 L45 75 C45 67 38 60 30 60 L20 60 C18 60 15 61 13 62 C13 50 20 30 60 30 C100 30 107 50 107 62 C105 61 102 60 100 60 L90 60 C82 60 75 67 75 75 L75 100 C75 108 82 115 90 115 L100 115 C112 115 120 105 120 95 L120 70 C120 55 110 15 60 15 Z" fill="white" opacity="0.2"/>
  </g>

  <!-- Main card -->
  <rect x="280" y="80" width="640" height="470" rx="28" fill="url(#cardGrad)" stroke="white" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Category tag -->
  <rect x="360" y="130" width="90" height="30" rx="15" fill="white" opacity="0.25"/>
  <text x="405" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">GUIDE</text>

  <!-- Main heading -->
  <text x="600" y="230" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">How to Learn English</text>
  <text x="600" y="284" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">Speaking at Home</text>

  <!-- Subtitle -->
  <text x="600" y="338" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="white" opacity="0.85" text-anchor="middle">A Complete Beginner's Guide</text>

  <!-- Divider -->
  <line x1="460" y1="368" x2="740" y2="368" stroke="white" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Feature pills row -->
  <g transform="translate(340, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="38" rx="19" fill="white" opacity="0.15"/>
    <text x="70" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">🗣 Speaking Tips</text>

    <!-- Pill 2 -->
    <rect x="156" y="0" width="140" height="38" rx="19" fill="white" opacity="0.15"/>
    <text x="226" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">📅 30-Day Plan</text>

    <!-- Pill 3 -->
    <rect x="312" y="0" width="168" height="38" rx="19" fill="white" opacity="0.15"/>
    <text x="396" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">🎯 For Beginners</text>
  </g>

  <!-- Bottom brand strip -->
  <rect x="280" y="500" width="640" height="50" rx="0" fill="white" opacity="0.08"/>
  <rect x="280" y="500" width="640" height="50" rx="0"/>
  <rect x="280" y="500" width="640" height="50" rx="0" fill="white" opacity="0.08"/>
  <text x="600" y="532" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="white" opacity="0.9" text-anchor="middle" letter-spacing="2">TYPEOYE.COM</text>
</svg>
