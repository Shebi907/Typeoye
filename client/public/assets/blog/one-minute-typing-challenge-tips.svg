<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Prepare for a one-minute typing challenge</title>
  <desc id="desc">A typist gets ready for a keyboard race, with hands on the keyboard and a clear 01:00 timer and typing metrics on the monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf2ff"/><stop offset="1" stop-color="#f5f1ff"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253256"/><stop offset="1" stop-color="#16213f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4361ee"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1c2748" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="600" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="75" r="145" fill="#4361ee" opacity=".07"/><circle cx="88" cy="535" r="135" fill="#7c3aed" opacity=".06"/>
  <text x="600" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#202a48">Ready, steady, type</text>
  <rect x="0" y="465" width="1200" height="135" fill="#d9c2a7"/>
  <path d="M0 478H1200" stroke="#c7ae91" stroke-width="7"/>
  <!-- Monitor -->
  <g filter="url(#shadow)">
    <rect x="360" y="110" width="590" height="335" rx="18" fill="#1a2237"/>
    <rect x="378" y="128" width="554" height="296" rx="9" fill="url(#screen)"/>
  </g>
  <rect x="405" y="153" width="500" height="36" rx="9" fill="#303e64"/>
  <circle cx="426" cy="171" r="6" fill="#7c8baa"/>
  <text x="451" y="177" font-family="Arial,sans-serif" font-size="13" fill="#dce4ff">HEAD-TO-HEAD · TYPING RACE</text>
  <rect x="428" y="211" width="220" height="119" rx="16" fill="#fff"/>
  <text x="538" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#67718c">TIME LEFT</text>
  <text x="538" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="53" font-weight="800" fill="#27345b">01:00</text>
  <rect x="670" y="211" width="205" height="119" rx="16" fill="#303e64"/>
  <text x="772" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#c9d4f2">YOUR LIVE STATS</text>
  <text x="720" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#b7c4e7">WPM</text>
  <text x="824" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#b7c4e7">ACCURACY</text>
  <path d="M772 294v22" stroke="#5b6b94" stroke-width="1.5"/>
  <text x="650" y="370" text-anchor="end" font-family="serif" font-size="26" fill="#e6ebfb">The quick brown fox jumps</text>
  <rect x="669" y="352" width="3" height="24" rx="1.5" fill="#8ea2ff"/>
  <text x="649" y="399" text-anchor="end" font-family="serif" font-size="20" fill="#9aa9ca">Keep a steady rhythm and read ahead</text>
  <path d="M635 445v23h40l16 17H568l16-17h42v-23" fill="#8c96ad"/>
  <!-- Typist, seen from behind -->
  <path d="M74 449c22-93 72-151 148-151s126 58 148 151" fill="#4562a7"/>
  <path d="M150 315c0-56 29-88 72-88s72 32 72 88c0 55-31 98-72 98s-72-43-72-98" fill="#d9a37f"/>
  <path d="M145 313c-7-60 25-105 78-105 58 0 88 44 79 103-18-11-28-25-36-46-28 30-72 44-121 48" fill="#342a2a"/>
  <path d="M146 345c9 45 37 71 76 71s68-26 77-71" fill="none" stroke="#bd8466" stroke-width="4"/>
  <path d="M120 449c55-24 100-33 140-28l197 36-15 35-216-19-84 33" fill="#d9a37f"/>
  <!-- Keyboard -->
  <g transform="translate(420 489) skewX(-12)">
    <rect x="0" y="0" width="560" height="78" rx="14" fill="#26314b" stroke="#111b32" stroke-width="4"/>
    <g fill="#68748d">
      <rect x="18" y="12" width="38" height="18" rx="4"/><rect x="64" y="12" width="38" height="18" rx="4"/><rect x="110" y="12" width="38" height="18" rx="4"/><rect x="156" y="12" width="38" height="18" rx="4"/><rect x="202" y="12" width="38" height="18" rx="4"/><rect x="248" y="12" width="38" height="18" rx="4"/><rect x="294" y="12" width="38" height="18" rx="4"/><rect x="340" y="12" width="38" height="18" rx="4"/><rect x="386" y="12" width="38" height="18" rx="4"/><rect x="432" y="12" width="38" height="18" rx="4"/><rect x="478" y="12" width="38" height="18" rx="4"/><rect x="524" y="12" width="22" height="18" rx="4"/>
      <rect x="28" y="38" width="40" height="18" rx="4"/><rect x="76" y="38" width="40" height="18" rx="4"/><rect x="124" y="38" width="40" height="18" rx="4"/><rect x="172" y="38" width="40" height="18" rx="4"/><rect x="220" y="38" width="40" height="18" rx="4"/><rect x="268" y="38" width="40" height="18" rx="4"/><rect x="316" y="38" width="40" height="18" rx="4"/><rect x="364" y="38" width="40" height="18" rx="4"/><rect x="412" y="38" width="40" height="18" rx="4"/><rect x="460" y="38" width="68" height="18" rx="4"/>
    </g>
  </g>
  <!-- hands on keys -->
  <path d="M527 482c19-38 41-51 61-45 15 4 14 19 4 32l-24 23 64 9c21 3 29 19 13 29-12 8-36 8-58 5l-83-10c-22-3-26-22-12-43l35 0" fill="#e4b08b"/>
  <path d="M919 484c-19-35-40-48-60-42-15 4-14 19-4 32l24 22-64 10c-21 3-28 19-13 29 12 8 36 8 58 5l82-10c22-3 26-22 12-43l-35-3" fill="#e4b08b"/>
  <text x="1050" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5e6883">One minute · one steady rhythm</text>
</svg>
