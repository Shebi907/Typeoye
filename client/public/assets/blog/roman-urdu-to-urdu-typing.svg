<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Roman Urdu to Urdu typing</title>
  <desc id="desc">Roman Urdu text changes visually to Urdu script in a clean Typeoye blue and purple design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4361ee"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="150" fill="#c7d2fe" opacity=".35"/><circle cx="112" cy="590" r="190" fill="#ddd6fe" opacity=".4"/>
  <text x="76" y="93" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#4361ee" letter-spacing="2">TYPEOYE  /  URDU TYPING GUIDE</text>
  <text x="76" y="166" font-family="Arial,sans-serif" font-size="43" font-weight="750" fill="#172554">Roman Urdu to Urdu</text>
  <text x="76" y="218" font-family="Arial,sans-serif" font-size="43" font-weight="750" fill="#172554">Typing</text>
  <rect x="76" y="280" width="1048" height="270" rx="26" fill="#fff" filter="url(#shadow)"/>
  <rect x="110" y="318" width="438" height="194" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="652" y="318" width="438" height="194" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="144" y="365" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#64748b" letter-spacing="1.5">ROMAN URDU</text>
  <text x="144" y="435" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#1e293b">mera naam Ali hai</text>
  <text x="144" y="474" font-family="Arial,sans-serif" font-size="17" fill="#64748b">English-letter spelling</text>
  <text x="686" y="365" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#64748b" letter-spacing="1.5">URDU SCRIPT</text>
  <text x="1048" y="440" text-anchor="end" direction="rtl" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#4338ca">میرا نام علی ہے</text>
  <circle cx="600" cy="415" r="27" fill="url(#brand)"/><path d="M590 415h19m-7-8 8 8-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569">Understand the difference between phonetic typing and transliteration</text>
</svg>
