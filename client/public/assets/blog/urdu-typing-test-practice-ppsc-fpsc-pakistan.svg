<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Urdu typing test practice for Pakistan government-job candidates</title>
  <desc id="desc">A candidate practises Urdu typing at a computer in a quiet home study. A keyboard is in the foreground and an Urdu passage appears on the monitor.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#dce9f6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9bb8b"/>
      <stop offset="1" stop-color="#cf9460"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#247e79"/>
      <stop offset="1" stop-color="#155a62"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c56c"/>
      <stop offset="1" stop-color="#e99b50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#253c58" flood-opacity=".16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Calm home-study background -->
  <rect width="1600" height="900" fill="url(#room)"/>
  <circle cx="1330" cy="130" r="185" fill="#fff" opacity=".34"/>
  <rect x="76" y="78" width="388" height="500" rx="24" fill="#bfd8ec"/>
  <rect x="94" y="96" width="352" height="464" rx="14" fill="#e7f3fc"/>
  <rect x="260" y="96" width="20" height="464" fill="#bfd8ec"/>
  <rect x="94" y="312" width="352" height="18" fill="#bfd8ec"/>
  <path d="M110 286c46-85 95-99 143-44v70H110z" fill="#a9d4c6" opacity=".82"/>
  <path d="M284 278c51-91 111-80 146-29v63H284z" fill="#86bda9" opacity=".8"/>
  <path d="M110 505c52-92 116-93 143-22v77H110z" fill="#b4d8c7"/>
  <path d="M280 526c45-78 100-73 150-18v52H280z" fill="#96c5af"/>
  <rect x="0" y="606" width="1600" height="294" fill="#dae5ed"/>
  <ellipse cx="816" cy="748" rx="640" ry="114" fill="#6c8295" opacity=".12" filter="url(#soft)"/>

  <!-- Desk and notebook -->
  <path d="M0 662 1600 614v286H0z" fill="url(#desk)"/>
  <path d="M0 685 1600 638" stroke="#f5d3aa" stroke-width="9" opacity=".65"/>
  <path d="M0 848 1600 810" stroke="#bd8054" stroke-width="3" opacity=".24"/>
  <g transform="translate(72 704) rotate(-7)">
    <rect width="206" height="134" rx="12" fill="#fffaf1" stroke="#dbc8ad" stroke-width="4"/>
    <path d="M25 38h150M25 68h132M25 98h105" stroke="#d6deea" stroke-width="5" stroke-linecap="round"/>
    <path d="M24 20h112" stroke="#72a9d7" stroke-width="7" stroke-linecap="round"/>
    <circle cx="18" cy="18" r="4" fill="#9caec0"/><circle cx="18" cy="46" r="4" fill="#9caec0"/><circle cx="18" cy="74" r="4" fill="#9caec0"/><circle cx="18" cy="102" r="4" fill="#9caec0"/>
  </g>

  <!-- Desktop monitor with a clean Urdu practice passage -->
  <g filter="url(#shadow)">
    <rect x="542" y="96" width="940" height="528" rx="30" fill="#24344a"/>
    <rect x="563" y="117" width="898" height="486" rx="18" fill="url(#screen)"/>
    <circle cx="1012" cy="106" r="4" fill="#7890a8"/>
    <rect x="920" y="624" width="184" height="28" rx="9" fill="#53677d"/>
    <path d="M866 654h294l54 29H812z" fill="#73879a"/>
    <rect x="595" y="150" width="834" height="52" rx="16" fill="#eef5ff"/>
    <circle cx="623" cy="176" r="7" fill="#20a785"/>
    <text x="648" y="184" fill="#58728d" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="1.1">URDU TYPING PRACTICE</text>
    <rect x="1322" y="161" width="84" height="30" rx="15" fill="#e0f4ed"/>
    <text x="1364" y="182" text-anchor="middle" fill="#128568" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">READY</text>
    <text x="1377" y="277" text-anchor="end" fill="#173d68" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="36" direction="rtl">روزانہ مشق سے رفتار بہتر ہوتی ہے</text>
    <text x="1377" y="342" text-anchor="end" fill="#315b83" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="31" direction="rtl">درست الفاظ اور مناسب وقفے اہم ہیں۔</text>
    <text x="1377" y="403" text-anchor="end" fill="#315b83" font-family="'Noto Nastaliq Urdu','Noto Naskh Arabic',serif" font-size="31" direction="rtl">سرکاری ہدایات غور سے پڑھیں۔</text>
    <rect x="610" y="454" width="780" height="1.5" fill="#d9e5f1"/>
    <text x="631" y="503" fill="#70869c" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">PRACTICE SESSION</text>
    <rect x="628" y="524" width="272" height="48" rx="14" fill="#eaf3ff"/>
    <text x="764" y="555" text-anchor="middle" fill="#2d6fc5" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Steady pace  ·  Check accuracy</text>
    <rect x="1240" y="524" width="145" height="48" rx="14" fill="#e3f5ef"/>
    <text x="1312" y="555" text-anchor="middle" fill="#128568" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">00:30</text>
  </g>

  <!-- Candidate, shown in profile at the desk -->
  <g>
    <!-- chair -->
    <path d="M345 472c-12-54 13-92 68-102h72c43 5 60 41 56 91l-13 157H374z" fill="#667e95"/>
    <path d="M388 602v106M493 604v105" stroke="#536a80" stroke-width="16" stroke-linecap="round"/>
    <path d="M354 711h170" stroke="#536a80" stroke-width="13" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M312 565c27-44 72-69 132-67 72 2 113 43 132 121l32 194H264l10-158c5-39 17-68 38-90z" fill="url(#shirt)"/>
    <path d="M395 512c12 45 45 76 85 93l-25 70c-46-22-82-57-103-105z" fill="url(#scarf)"/>
    <path d="M485 515c-5 53-36 92-78 119l37 54c49-32 84-77 94-133z" fill="#f1b65f"/>
    <!-- neck and face -->
    <path d="M401 381v105c31 29 75 29 107 0V379z" fill="#bd795d"/>
    <ellipse cx="443" cy="331" rx="104" ry="127" fill="#c98264"/>
    <!-- hair and dupatta around head -->
    <path d="M335 336c-25-88 4-161 81-184 66-20 138 10 159 82 13 44 4 104-20 147l-28-11c13-60-1-112-41-127-22 42-71 72-151 81z" fill="#26334a"/>
    <path d="M336 301c2-91 54-145 128-145 63 0 109 43 119 104-54-19-100-20-140 3-30 17-61 35-107 38z" fill="#28374d"/>
    <path d="M342 243c-45 36-58 111-28 181 20 48 68 83 127 95-42-41-56-89-47-141 9-49 42-88 87-112-42 6-88 2-139-23z" fill="url(#scarf)"/>
    <path d="M437 308c17-10 35-11 52-3" fill="none" stroke="#583a36" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="462" cy="323" rx="6" ry="5" fill="#293b4b"/>
    <path d="M483 366c16 11 31 9 42-3" fill="none" stroke="#8e4e47" stroke-width="5" stroke-linecap="round"/>
    <path d="M522 350q15 10 20 2" fill="none" stroke="#b46b52" stroke-width="4" stroke-linecap="round"/>
    <circle cx="531" cy="346" r="4" fill="#f7d18b"/>
    <!-- arms reaching keyboard -->
    <path d="M376 626c88 17 178 45 285 91l-24 51c-116-31-214-54-308-86z" fill="#c98264"/>
    <path d="M518 641c72 5 141 18 226 42l-14 57c-98-11-171-18-244-11z" fill="#d48d6c"/>
    <path d="M624 712c18-6 39-7 60-5l12 4-5 17c-19 1-34 4-50 10l-19-8z" fill="#c98264"/>
    <path d="M710 674c18 0 38 4 56 11l12 8-11 15c-20-6-37-8-56-8l-13-13z" fill="#d48d6c"/>
  </g>

  <!-- Full-size keyboard makes the practice context unmistakable -->
  <g filter="url(#shadow)" transform="translate(590 694) skewX(-8)">
    <rect width="608" height="130" rx="18" fill="#27384e"/>
    <g fill="#dbe5ef" opacity=".93">
      <rect x="18" y="16" width="34" height="24" rx="5"/><rect x="59" y="16" width="34" height="24" rx="5"/><rect x="100" y="16" width="34" height="24" rx="5"/><rect x="141" y="16" width="34" height="24" rx="5"/><rect x="182" y="16" width="34" height="24" rx="5"/><rect x="223" y="16" width="34" height="24" rx="5"/><rect x="264" y="16" width="34" height="24" rx="5"/><rect x="305" y="16" width="34" height="24" rx="5"/><rect x="346" y="16" width="34" height="24" rx="5"/><rect x="387" y="16" width="34" height="24" rx="5"/><rect x="428" y="16" width="34" height="24" rx="5"/><rect x="469" y="16" width="34" height="24" rx="5"/><rect x="510" y="16" width="76" height="24" rx="5"/>
      <rect x="18" y="48" width="50" height="25" rx="5"/><rect x="75" y="48" width="34" height="25" rx="5"/><rect x="116" y="48" width="34" height="25" rx="5"/><rect x="157" y="48" width="34" height="25" rx="5"/><rect x="198" y="48" width="34" height="25" rx="5"/><rect x="239" y="48" width="34" height="25" rx="5"/><rect x="280" y="48" width="34" height="25" rx="5"/><rect x="321" y="48" width="34" height="25" rx="5"/><rect x="362" y="48" width="34" height="25" rx="5"/><rect x="403" y="48" width="34" height="25" rx="5"/><rect x="444" y="48" width="34" height="25" rx="5"/><rect x="485" y="48" width="101" height="25" rx="5"/>
      <rect x="18" y="81" width="68" height="25" rx="5"/><rect x="93" y="81" width="34" height="25" rx="5"/><rect x="134" y="81" width="34" height="25" rx="5"/><rect x="175" y="81" width="34" height="25" rx="5"/><rect x="216" y="81" width="34" height="25" rx="5"/><rect x="257" y="81" width="34" height="25" rx="5"/><rect x="298" y="81" width="34" height="25" rx="5"/><rect x="339" y="81" width="34" height="25" rx="5"/><rect x="380" y="81" width="34" height="25" rx="5"/><rect x="421" y="81" width="34" height="25" rx="5"/><rect x="462" y="81" width="124" height="25" rx="5"/>
    </g>
    <rect x="208" y="112" width="236" height="8" rx="4" fill="#a9bdd0" opacity=".75"/>
    <path d="M36 26h10M76 26h10M117 26h10M158 26h10M199 26h10M240 26h10M281 26h10M322 26h10M363 26h10M404 26h10M445 26h10M497 26h8" stroke="#52677d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Plant adds a small, warm study detail -->
  <g transform="translate(1400 513)">
    <path d="M54 107c-1-75-7-132-20-181M58 90c28-52 54-77 84-93M48 76C20 37 4 15-14-21M43 58c-3-56 4-89 23-121" fill="none" stroke="#4f8b69" stroke-width="8" stroke-linecap="round"/>
    <path d="M26 4c-37 0-60-26-56-58 33-2 59 19 56 58zM82 31c4-38 28-63 63-67 2 34-19 62-63 67zM50-28c-28-25-28-58-4-82 29 18 37 50 4 82z" fill="#64a87f"/>
    <path d="M4 96h104l-13 82H18z" fill="#f2f5f8"/>
    <ellipse cx="56" cy="96" rx="52" ry="13" fill="#d7e1e8"/>
    <ellipse cx="56" cy="98" rx="39" ry="8" fill="#7a5a3d"/>
  </g>
</svg>
