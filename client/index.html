<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme BEFORE first paint. Without this, a dark-mode
      // reload paints the light site first and then flips once the JS bundle
      // boots (a visible flash), because the theme is resolved in settingsStore
      // at module-evaluation time. Mirrors that resolution exactly:
      // 'light' | 'dark' | 'system' (system follows the OS preference).
      (function () {
        try {
          var saved = localStorage.getItem('typeoye_theme') || 'light';
          var dark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          // color-scheme styles the pre-CSS canvas + native controls so there is
          // no white flash even before index.css is applied.
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>Free Typing Test – Check Your Typing Speed &amp; Accuracy | Typeoye</title>
    <meta
      name="description"
      content="Take a free typing test online with Typeoye. Check your typing speed, WPM and accuracy, then practice to improve your typing skills."
    />
    <script>
      // Site-wide canonical fix for the SPA: this single index.html is served
      // for EVERY route, so a hardcoded homepage canonical made crawlers that
      // snapshot before the app boots treat every page as an alternate of the
      // homepage. Derive the canonical + og:url from the actual URL instead
      // (self-referencing for every page) at parse time, before the bundle
      // loads. Path only — query strings and hashes are stripped, and a
      // trailing slash is normalized away for consistency.
      (function () {
        // Per-route title/description map, injected at build time by the
        // seo-meta Vite plugin (see the marker below). Absent in a raw/static
        // serve, in which case the static <title> and meta tags in this file
        // remain the fallback.
        var SEO_META = /*__SEO_META__*/null;

        var path = window.location.pathname;
        if (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
        var canonicalUrl = window.location.origin + path;

        var canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement('link');
          canonical.setAttribute('rel', 'canonical');
          document.head.appendChild(canonical);
        }
        canonical.setAttribute('href', canonicalUrl);

        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (!ogUrl) {
          ogUrl = document.createElement('meta');
          ogUrl.setAttribute('property', 'og:url');
          document.head.appendChild(ogUrl);
        }
        ogUrl.setAttribute('content', canonicalUrl);

        // Route-specific metadata: exact path match first, then walk up the
        // path segments in case a prefix route covers dynamic segments (e.g.
        // /blog/* for /blog/some-new-slug, /challenge/* for /challenge/XYZ).
        var meta = null;
        if (SEO_META) {
          meta = SEO_META[path] || null;
          if (!meta) {
            var i = path.lastIndexOf('/');
            while (!meta && i > 0) {
              meta = SEO_META[path.slice(0, i) + '/*'] || null;
              i = path.lastIndexOf('/', i - 1);
            }
          }
        }
        if (meta) {
          document.title = meta.title;
          function setMeta(attr, name, content) {
            var el = document.querySelector('meta[' + attr + '="' + name + '"]');
            if (!el) {
              el = document.createElement('meta');
              el.setAttribute(attr, name);
              document.head.appendChild(el);
            }
            el.setAttribute('content', content);
          }
          setMeta('name', 'description', meta.description);
          setMeta('property', 'og:title', meta.title);
          setMeta('property', 'og:description', meta.description);
          setMeta('name', 'twitter:title', meta.title);
          setMeta('name', 'twitter:description', meta.description);
        }
      })();
    </script>
